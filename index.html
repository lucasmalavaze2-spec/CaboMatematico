<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cabo de Guerra Matemático - Pro</title>
    <style>
        :root { 
            --p1: #00d2ff; --p2: #ff9d00; 
            --bg: #003b5c; 
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #004e92 0%, #000428 100%);
            color: white; margin: 0; overflow: hidden; touch-action: none;
            display: flex; flex-direction: column; align-items: center; height: 100vh;
        }

        /* MENU INICIAL */
        #overlay-menu {
            position: fixed; inset: 0; 
            background: radial-gradient(circle at center, rgba(0,78,146,0.95) 0%, rgba(0,4,40,1) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
            backdrop-filter: blur(10px);
        }

        h1 { font-size: 4rem; margin: 0; font-weight: 300; background: linear-gradient(to bottom, #fff, #a5d8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1rem; color: #00d2ff; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 30px; }

        .btn-nivel {
            width: 350px; padding: 15px; margin: 8px; font-size: 1.1rem; cursor: pointer;
            border-radius: 12px; border: 2px solid; background: rgba(255,255,255,0.05);
            color: white; font-weight: 600; transition: 0.3s; display: flex; justify-content: space-between;
        }
        .btn-6 { border-color: #2ecc71; color: #2ecc71; }
        .btn-7 { border-color: #f1c40f; color: #f1c40f; }
        .btn-8 { border-color: #e74c3c; color: #e74c3c; }
        .btn-9 { border-color: #9b59b6; color: #9b59b6; }
        .btn-em { border-color: #3498db; color: #3498db; }

        /* JOGO */
        #jogo { display: none; width: 100%; flex-direction: column; align-items: center; }
        #arena-visual { width: 100%; height: 30vh; position: relative; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); }
        #timer-circulo { position: absolute; top: 15px; width: 60px; height: 60px; border: 2px solid #00d2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: rgba(0,0,0,0.5); }
        
        #corda { position: absolute; width: 300%; height: 8px; background: rgba(255,255,255,0.6); box-shadow: 0 0 15px #fff; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #lenco { width: 4px; height: 35px; background: #ff4757; margin: auto; }

        #questao-wrapper { margin-top: -25px; background: white; color: #001f3f; padding: 20px 50px; border-radius: 15px; z-index: 20; box-shadow: 0 15px 30px rgba(0,0,0,0.3); text-align: center; }
        #questao-txt { font-size: 2.5rem; font-weight: 800; }

        .controles-container { display: flex; width: 100%; justify-content: space-around; padding: 20px; flex-grow: 1; align-items: flex-end; }
        .display-box { font-size: 2rem; background: rgba(0,0,0,0.3); color: white; width: 200px; height: 55px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
        .teclado-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .btn-t { width: 60px; height: 60px; font-size: 1.4rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; cursor: pointer; }

        /* TELA DE VITÓRIA */
        #tela-vitoria {
            position: fixed; inset: 0; background: rgba(0,4,40,0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
            backdrop-filter: blur(20px);
        }
        .card-vitoria {
            background: rgba(255,255,255,0.05); padding: 40px; border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 80%; max-width: 600px;
        }
        .vencedor-nome { font-size: 3rem; margin-bottom: 20px; background: linear-gradient(to right, #00d2ff, #2ecc71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .stat-item { text-align: center; }
        .stat-val { display: block; font-size: 1.5rem; font-weight: bold; }
        .stat-label { font-size: 0.8rem; color: #888; text-transform: uppercase; }

        .btn-vitoria { padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin: 10px; font-size: 1rem; transition: 0.3s; }
        .btn-share { background: #00d2ff; color: #000; }
        .btn-menu { background: transparent; color: #fff; border: 2px solid #fff; }
    </style>
</head>
<body>

    <div id="overlay-menu">
        <h1>Cabo de Guerra</h1>
        <div class="subtitle">by Malavaze</div>
        <button class="btn-nivel btn-6" onclick="start(6)">6º ANO <span>+ / ×</span></button>
        <button class="btn-nivel btn-7" onclick="start(7)">7º ANO <span>Inteiros</span></button>
        <button class="btn-nivel btn-8" onclick="start(8)">8º ANO <span>x²</span></button>
        <button class="btn-nivel btn-9" onclick="start(9)">9º ANO <span>Equações</span></button>
        <button class="btn-nivel btn-em" onclick="start(10)">ENSINO MÉDIO <span>log / sen</span></button>
    </div>

    <div id="jogo">
        <div id="arena-visual">
            <div id="timer-circulo">15</div>
            <div id="corda"><div id="lenco"></div></div>
        </div>
        <div id="questao-wrapper"><div id="questao-txt">---</div></div>
        <div class="controles-container">
            <div class="painel">
                <div id="d-j1" class="display-box"></div>
                <div class="teclado-grid" id="tec1"></div>
            </div>
            <div class="painel">
                <div id="d-j2" class="display-box"></div>
                <div class="teclado-grid" id="tec2"></div>
            </div>
        </div>
    </div>

    <div id="tela-vitoria">
        <div class="card-vitoria" id="capture-area">
            <div class="vencedor-nome" id="txt-vencedor">JOGADOR 1 VENCEU!</div>
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-val" id="s-acerto1">0</span><span class="stat-label">Acertos J1</span></div>
                <div class="stat-item"><span class="stat-val" id="s-acerto2">0</span><span class="stat-label">Acertos J2</span></div>
                <div class="stat-item"><span class="stat-val" id="s-erro1">0</span><span class="stat-label">Erros J1</span></div>
                <div class="stat-item"><span class="stat-val" id="s-erro2">0</span><span class="stat-label">Erros J2</span></div>
                <div class="stat-item"><span class="stat-val" id="s-tempo1">0s</span><span class="stat-label">Tempo Médio J1</span></div>
                <div class="stat-item"><span class="stat-val" id="s-tempo2">0s</span><span class="stat-label">Tempo Médio J2</span></div>
            </div>
            <button class="btn-vitoria btn-share" onclick="compartilhar()">COMPARTILHAR RESULTADO</button>
            <button class="btn-vitoria btn-menu" onclick="location.reload()">VOLTAR AO MENU</button>
        </div>
    </div>

    <script>
        let pos = 0, ans = 0, lv = 6, tempo = 15;
        let uInput = {1: "", 2: ""};
        let stats = { 1: { acertos: 0, erros: 0, tempos: [] }, 2: { acertos: 0, erros: 0, tempos: [] } };
        let inicioQuestao = Date.now();
        const f = 12, lim = 85;

        // Criar teclados
        [1,2].forEach(p => {
            const tec = document.getElementById(`tec${p}`);
            "123456789-0,".split("").forEach(v => {
                tec.innerHTML += `<button class="btn-t" onclick="press(${p},'${v}')">${v}</button>`;
            });
            tec.innerHTML += `<button class="btn-t" style="background:#c0392b" onclick="clr(${p})">C</button>`;
            tec.innerHTML += `<button class="btn-t" style="background:#27ae60; grid-column: span 2" onclick="check(${p})">PUXAR!</button>`;
        });

        function start(n) {
            lv = n; document.getElementById('overlay-menu').style.display = 'none';
            document.getElementById('jogo').style.display = 'flex';
            newQ();
            setInterval(() => {
                tempo -= 0.1;
                document.getElementById('timer-circulo').innerText = Math.ceil(tempo);
                if(tempo <= 0) newQ();
            }, 100);
        }

        function press(id, v) { uInput[id] += v; document.getElementById(`d-j${id}`).innerText = uInput[id]; }
        function clr(id) { uInput[id] = ""; document.getElementById(`d-j${id}`).innerText = ""; }

        function check(id) {
            let v = parseFloat(uInput[id].replace(',', '.'));
            let tResp = (Date.now() - inicioQuestao) / 1000;

            if (Math.abs(v - ans) < 0.01) {
                stats[id].acertos++;
                stats[id].tempos.push(tResp);
                pos += (id === 1) ? -f : f;
                if (Math.abs(pos) >= lim) finalizar(id);
                else newQ();
            } else {
                stats[id].erros++;
                pos += (id === 1) ? (f/2) : -(f/2);
                clr(id);
            }
            document.getElementById('corda').style.transform = `translateX(${pos}%)`;
        }

        function newQ() {
            clr(1); clr(2); tempo = 15; inicioQuestao = Date.now();
            const q = document.getElementById('questao-txt');
            let a, b, x, m;
            switch(lv) {
                case 6: a=rand(10,50); b=rand(10,50); ans=a+b; q.innerText=`${a} + ${b}`; break;
                case 7: a=rand(-20,20); b=rand(-20,20); ans=a-b; q.innerText=`(${a}) - (${b})`; break;
                case 8: a=rand(2,15); ans=a*a; q.innerHTML=`${a}²`; break;
                case 9: x=rand(1,12); a=rand(2,8); b=rand(1,20); ans=x; q.innerText=`${a}x + ${b} = ${a*x+b}`; break;
                case 10: a=[2,3,5,10][rand(0,3)]; x=rand(1,4); ans=x; q.innerHTML=`log<sub>${a}</sub>(${Math.pow(a,x)})`; break;
            }
        }

        function finalizar(vencedor) {
            document.getElementById('jogo').style.display = 'none';
            document.getElementById('tela-vitoria').style.display = 'flex';
            document.getElementById('txt-vencedor').innerText = `JOGADOR ${vencedor} VENCEU!`;
            
            const calcMedia = (arr) => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) + "s" : "0s";
            
            document.getElementById('s-acerto1').innerText = stats[1].acertos;
            document.getElementById('s-acerto2').innerText = stats[2].acertos;
            document.getElementById('s-erro1').innerText = stats[1].erros;
            document.getElementById('s-erro2').innerText = stats[2].erros;
            document.getElementById('s-tempo1').innerText = calcMedia(stats[1].tempos);
            document.getElementById('s-tempo2').innerText = calcMedia(stats[2].tempos);
        }

        function compartilhar() {
            const texto = `Ganhei no Cabo de Guerra Matemático! 🏆\nEstatísticas:\nJ1: ${stats[1].acertos} acertos | J2: ${stats[2].acertos} acertos`;
            if (navigator.share) {
                navigator.share({ title: 'Resultado Cabo de Guerra', text: texto, url: window.location.href });
            } else {
                alert("Copiado para a área de transferência!");
                navigator.clipboard.writeText(texto);
            }
        }

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1) + min); }
    </script>
</body>
</html>
